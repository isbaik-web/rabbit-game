<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>토끼 당근 점프 - 소개 영상</title>
<style>
  html, body {
    margin: 0; width: 100%; height: 100%; background: #1d2a33; overflow: hidden;
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
  }
  #wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
  #stage { position: relative; width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; }
  canvas { width: 100%; height: 100%; display: block; }
  #playLink { position: absolute; inset: 0; display: none; cursor: pointer; }
  #replay {
    position: absolute; right: 2%; bottom: 3%; display: none;
    font: inherit; font-weight: 700; font-size: clamp(12px, 1.8vw, 18px);
    color: #3b2a1e; background: rgba(255, 250, 240, .9); border: 0; border-radius: 999px;
    padding: .5em 1.1em; cursor: pointer;
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="stage">
    <canvas id="c"></canvas>
    <a id="playLink" href="index.html" aria-label="지금 플레이"></a>
    <button id="replay" type="button">다시 보기</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  var W = 960, H = 540, GROUND = 450, DURATION = 10;
  var canvas = document.getElementById('c'), ctx = canvas.getContext('2d');
  var playLink = document.getElementById('playLink'), replayBtn = document.getElementById('replay');

  function resize() {
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    var cssW = canvas.getBoundingClientRect().width || W;
    var s = cssW / W * dpr;
    canvas.width = Math.round(W * s);
    canvas.height = Math.round(H * s);
    ctx.setTransform(s, 0, 0, s, 0, 0);
  }
  window.addEventListener('resize', resize);

  // ---------- 이징 ----------
  function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
  function prog(t, a, b) { return clamp((t - a) / (b - a), 0, 1); }
  function easeOutBack(p) { var c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }
  function easeOutCubic(p) { return 1 - Math.pow(1 - p, 3); }

  function ellipse(x, y, rx, ry, color, rot) {
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, rot || 0, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  }

  // ---------- 배경 ----------
  function drawBackground(t) {
    var g = ctx.createLinearGradient(0, 0, 0, GROUND);
    g.addColorStop(0, '#8fd3f2');
    g.addColorStop(1, '#e6f7fd');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    ellipse(840, 90, 44, 44, '#ffe27a');

    var cs = t * 18;
    for (var i = 0; i < 5; i++) {
      var cx = ((i * 260 - cs) % 1300 + 1300) % 1300 - 150;
      var cy = 90 + (i % 2) * 60;
      ellipse(cx, cy, 52, 24, '#fff');
      ellipse(cx + 38, cy - 14, 34, 20, '#fff');
      ellipse(cx - 34, cy - 7, 30, 17, '#fff');
    }

    var hs = t * 36;
    ctx.fillStyle = '#a5dc8c';
    ctx.beginPath();
    ctx.moveTo(0, GROUND);
    for (var x = 0; x <= W; x += 10) {
      ctx.lineTo(x, GROUND - 60 - 30 * Math.sin((x + hs) / 80) - 16 * Math.sin((x + hs) / 33));
    }
    ctx.lineTo(W, GROUND);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle = '#7ccb5a';
    ctx.fillRect(0, GROUND, W, 20);
    ctx.fillStyle = '#b98a5a';
    ctx.fillRect(0, GROUND + 20, W, H - GROUND - 20);
  }

  // ---------- 토끼 (원점 = 발 밑 왼쪽, 게임과 같은 그림) ----------
  function drawRabbit(x, y, s, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(s, s);
    var sw = Math.sin(t * 16) * 6;
    var ear = Math.sin(t * 16) * 0.08;
    var hop = Math.abs(Math.sin(t * 8)) * 6;
    ctx.translate(0, -hop);
    ellipse(16 + sw, -4, 8, 4, '#f1e6d8');
    ellipse(34 - sw, -4, 8, 4, '#f1e6d8');
    ellipse(3, -22, 6, 6, '#fff');
    ellipse(22, -20, 20, 14, '#fff');
    ellipse(22, -14, 14, 8, '#f6efe6');
    ellipse(34, -58, 5, 16, '#fff', 0.15 + ear);
    ellipse(34, -58, 2.5, 11, '#ffb8c6', 0.15 + ear);
    ellipse(44, -56, 5, 16, '#fff', 0.35 + ear);
    ellipse(44, -56, 2.5, 11, '#ffb8c6', 0.35 + ear);
    ellipse(40, -34, 12, 11, '#fff');
    ellipse(44, -37, 2.4, 2.8, '#3b2a1e');
    ellipse(51, -32, 2.2, 1.8, '#ff7f9c');
    ellipse(40, -29, 3.5, 2.5, 'rgba(255,150,170,.55)');
    ctx.restore();
  }

  // ---------- 당근 (원점 = 몸통 중심) ----------
  function drawCarrot(x, y, s, rot) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);
    ctx.scale(s, s);
    ctx.translate(-20, 18);   // 게임 그림의 (x+20, b-18)이 원점이 되도록
    ctx.fillStyle = '#3fae49';
    ctx.beginPath(); ctx.ellipse(14, -42, 4, 11, -0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(20, -44, 4, 12, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(26, -42, 4, 11, 0.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(6, -34);
    ctx.quadraticCurveTo(20, -42, 34, -34);
    ctx.lineTo(22, 2);
    ctx.quadraticCurveTo(20, 5, 18, 2);
    ctx.closePath();
    ctx.fillStyle = '#ff8a1f';
    ctx.fill();
    ctx.strokeStyle = '#e36d00';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(12, -28); ctx.lineTo(18, -28); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(22, -20); ctx.lineTo(28, -20); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(15, -12); ctx.lineTo(20, -12); ctx.stroke();
    ctx.restore();
  }

  // 떨어지는 당근: [시작 시각, x, 회전 속도]
  var CARROTS = [
    [3.6, 180, 2.2], [4.2, 400, -1.8], [4.8, 640, 2.6], [5.4, 820, -2.2],
    [6.0, 290, 1.6], [6.6, 540, -2.4], [7.2, 740, 2.0], [7.8, 100, -1.6]
  ];
  var FALL = 0.8;     // 떨어지는 시간(초)
  var LAND_Y = GROUND - 14;

  function drawCarrots(t) {
    for (var i = 0; i < CARROTS.length; i++) {
      var c = CARROTS[i], lt = t - c[0];
      if (lt < 0) continue;
      var y, rot;
      if (lt < FALL) {
        var p = lt / FALL;
        y = -40 + (LAND_Y + 40) * p * p;           // 가속하며 낙하
        rot = c[2] * lt;
      } else {
        var b = lt - FALL;                          // 착지 후 한 번 튕김
        y = LAND_Y - Math.abs(Math.sin(b * 7)) * 36 * Math.exp(-b * 4.5);
        rot = c[2] * FALL + (c[2] > 0 ? 0.35 : -0.35) * (1 - Math.exp(-b * 6));
      }
      drawCarrot(c[1], y, 1.5, rot);
    }
  }

  // ---------- 글자 ----------
  function textCenter(str, x, y, size, fill, stroke, lw) {
    ctx.font = '900 ' + size + 'px "Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineJoin = 'round';
    if (stroke) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.strokeText(str, x, y); }
    ctx.fillStyle = fill;
    ctx.fillText(str, x, y);
  }

  function drawTitle(t) {
    // 0~1.1초: 튀어나옴, 이후 위로 올라가 작아짐
    var pop = easeOutBack(prog(t, 0.1, 1.1));
    var move = easeOutCubic(prog(t, 2.2, 3.2));
    var cy = H / 2 - 10 - move * (H / 2 - 120);
    var sc = pop * (1 - move * 0.35);
    if (sc <= 0.001) return;
    ctx.save();
    ctx.translate(W / 2, cy);
    ctx.rotate((1 - prog(t, 0.1, 1.1)) * -0.12);
    ctx.scale(sc, sc);
    textCenter('토끼 당근 점프', 0, 0, 120, '#ff8a1f', '#fffaf0', 22);
    textCenter('토끼 당근 점프', 0, 0, 120, '#ff8a1f', null);
    ctx.restore();

    var sub = prog(t, 1.2, 1.9) * (1 - prog(t, 2.2, 2.8));
    if (sub > 0) {
      ctx.globalAlpha = sub;
      textCenter('당근을 점프로 넘어요!', W / 2, H / 2 + 80, 40, '#3b2a1e', '#fffaf0', 8);
      ctx.globalAlpha = 1;
    }
  }

  function drawCTA(t) {
    var a = prog(t, 7.6, 8.1);
    if (a <= 0) return;
    // 깜빡임: 0.5초 주기로 켜졌다 꺼졌다
    var on = Math.floor((t - 7.6) / 0.5) % 2 === 0 ? 1 : 0.12;
    var pulse = 1 + 0.04 * Math.sin(t * 12);
    ctx.save();
    ctx.globalAlpha = a * on;
    ctx.translate(W / 2, 330);
    ctx.scale(pulse, pulse);
    var w = 360, h = 96, r = 48;
    ctx.beginPath();
    ctx.moveTo(-w / 2 + r, -h / 2); ctx.lineTo(w / 2 - r, -h / 2);
    ctx.arc(w / 2 - r, 0, r, -Math.PI / 2, Math.PI / 2);
    ctx.lineTo(-w / 2 + r, h / 2);
    ctx.arc(-w / 2 + r, 0, r, Math.PI / 2, Math.PI * 1.5);
    ctx.closePath();
    ctx.fillStyle = '#ff8a1f';
    ctx.shadowColor = 'rgba(217,106,0,1)'; ctx.shadowOffsetY = 8;
    ctx.fill();
    ctx.shadowColor = 'transparent';
    textCenter('지금 플레이', 0, 3, 54, '#fff', null);
    ctx.restore();
  }

  // ---------- 한 프레임 ----------
  function draw(t) {
    drawBackground(t);
    drawCarrots(t);

    // 토끼: 2.4~6.9초 동안 화면 왼쪽 밖 → 오른쪽 밖
    var rp = prog(t, 2.4, 6.9);
    if (rp > 0 && rp < 1) drawRabbit(-120 + rp * (W + 240), GROUND + 6, 2.4, t);

    drawTitle(t);
    drawCTA(t);
  }

  // ---------- 재생 ----------
  var start = 0, finished = false, fixedT = null;
  function begin() {
    start = performance.now();
    finished = false;
    playLink.style.display = 'none';
    replayBtn.style.display = 'none';
  }
  function frame(now) {
    var t = fixedT !== null ? fixedT : (now - start) / 1000;
    draw(t);
    if (!finished && t >= DURATION) {
      finished = true;
      playLink.style.display = 'block';   // 마지막 글자 클릭 시 게임으로 이동
      replayBtn.style.display = 'block';
    }
    requestAnimationFrame(frame);
  }
  replayBtn.addEventListener('click', begin);

  // 확인용: intro.html?t=5 처럼 특정 시점을 고정해서 볼 수 있음
  var m = /[?&]t=([\d.]+)/.exec(location.search);
  if (m) fixedT = parseFloat(m[1]);

  resize();
  begin();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
